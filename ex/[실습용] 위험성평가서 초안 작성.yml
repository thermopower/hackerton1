            \ → 어떤 원인으로 → 어떤 사고가 발생하는지\"가 드러나는\n현실적인 사고 시나리오 2가지를 작성하십시오.\n</GOAL>\n\
            \n<HOW_TO_THINK>\n아래 관점으로 사고를 예측하십시오.\n\n1. 높은 곳에서 작업하는가? → 떨어질 가능성\n\
            2. 장비(굴착기, 지게차 등)가 있는가? → 끼임, 충돌, 전도 가능성\n3. 무거운 물건을 드는가? → 낙하, 협착, 허리부상\
