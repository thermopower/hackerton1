            \ 발생하는가? → 화재, 화상 가능성\n7. 땅을 파는가? → 토사 붕괴, 매설물 파손 가능성\n8. 회전하는 공구가 있는가?\
            \ → 말림, 절단 가능성\n9. 바닥이 미끄러운가? → 넘어짐 가능성\n\n작업 도구, 위치, 환경을 반드시 고려하여 사고를\
            \ 구체적으로 묘사하십시오.\n</HOW_TO_THINK>\n\n<WRITING_RULE>\n1. 모호한 표현 금지 (예: 다칠\
