        prompt_template:
        - role: system
          text: '입력된 JSON을 이메일용 XHTML HTML로 변환하라.


            규칙:

            - [응답] 같은 내용 출력 금지하고 HTML만 출력

            - 마크다운/설명 금지

            - 예시 HTML의 table 구조와 style을 최대한 유지

            - title, To, 건수, 분기, 칭찬 유형, 칭찬 내용을 입력값으로 치환

            - `응답시간`에서 연도/분기를 계산

            - `칭찬받은_사람`을 제목과 수신자명에 사용

            - `칭찬_유형N`, `칭찬_내용N`을 인덱스별로 읽어 칭찬 항목 생성

            - `추가_여부N`이 "아니요, 여기까지 할게요."이면 거기서 종료

            - 같은 유형끼리 묶어서 섹션 생성

            - 유형 라벨 매핑:

            공감형 -> 👍 공감 한 스푼

            정성형 -> 🌱 정성 한 스푼

            - 누락값은 빈 문자열 처리


            [HTML 템플릿 규칙]

            - 아래 구조와 스타일을 최대한 동일하게 유지한다.

            - 단, 이름, 분기, 건수, 칭찬 유형 섹션, 칭찬 내용은 입력값에 맞게 동적으로 바꾼다.'
