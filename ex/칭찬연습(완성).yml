        desc: ''
        instruction: '아래 엑셀 파일은 사내 칭찬 설문 raw data 입니다. 이 데이터를 칭찬받은 사람 기준으로 재구성해서 JSON
          으로 출력해주세요.

          데이터 구조는 각 행이 한 응답자가 최대 3명에게 칭찬을 남긴 구조입니다. 응답자 정보는 A열 응답시간, B열 칭찬한 사람 이름,
          C열 기업 단체명, D열 부서, E열 이메일에 있습니다. 칭찬 세트는 최대 3개이며 첫 번째 칭찬은 G열 칭찬받는 사람 이름, H열
          수신이메일, I열 칭찬유형, K열 정성 언제 어떤 상황, L열 정성 칭찬내용, N열 공감 칭찬내용, P열 추가여부 입니다. 두 번째
          칭찬은 R열 이름, S열 수신이메일, T열 칭찬유형, V열 정성 상황, W열 정성 내용, Y열 공감 내용, AA열 추가여부 입니다.
          세 번째 칭찬은 AC열 이름, AD열 수신이메일, AE열 칭찬유형, AG열 정성 상황, AH열 정성 내용, AJ열 공감 내용 입니다.
          두 번째 칭찬은 P열이 네 한 명 더 남길게요 일 때만 존재하고, 세 번째 칭찬은 AA열이 동일할 때만 존재합니다. 칭찬 유형은
          해당 열에 정성 한 스푼이 포함되면 정성형, 공감 한 스푼이 포함되면 공감형으로 판별합니다.

          전처리 규칙은 칭찬받은 사람 이름인 G열, R열, AC열에서 슬래시, 괄호, 부서명, 매니저 등 이름 외 텍스트를 모두 제거하고
          앞 세 글자만 남깁니다. 단 은진은 두 글자 그대로 유지합니다. 예를 들어 이승엽 인사 문화팀 은 이승엽 으로 정제합니다.

          핵심 변환 로직은 세 단계입니다. 첫째로 raw 1행을 칭찬 단위 레코드로 분리합니다. 한 응답자가 3명에게 칭찬했다면 3개의 레코드로
          펼칩니다. 각 레코드는 응답시간, 칭찬받은 사람 정제된 이름, 수신이메일, 칭찬한 사람, 기업 단체명, 부서, 이메일, 칭찬유형,
          언제 상황, 칭찬내용, 추가여부 필드를 가집니다. 둘째로 정제된 칭찬받은 사람 이름을 기준으로 레코드들을 그룹화합니다. 이름이 같은
          레코드들은 같은 사람으로 판단해서 하나의 객체로 묶습니다. 셋째로 묶인 객체 안에서 칭찬한 사람들은 번호를 붙여 가로로 나열합니다.
          첫 번째 칭찬한 사람 정보는 칭찬한 사람1, 기업 단체명1, 부서1, 이메일1, 칭찬 유형1, 칭찬 내용1, 추가 여부1 로, 두
          번째는 숫자만 2로, 세 번째는 3으로 붙입니다. 정성형인 경우 언제 상황 필드도 번호를 붙여 함께 포함합니다.

          출력 형식은 아래 JSON 배열 구조를 따릅니다.

          [{"응답시간": "2026.03.05 09:13", "칭찬받은_사람": "이승엽", "수신이메일": "smj1208@gsbchp.com",
          "칭찬한_사람1": "조천일", "기업_단체명1": "GS E&R", "부서1": "회계팀", "이메일1": "chunil@gsenr.com",
          "칭찬_유형1": "공감 한 스푼", "칭찬_내용1": "책임감 있게 마무리해 줬어요.", "추가_여부1": "네, 한 명 더 남길게요",
          "칭찬한_사람2": "조천일", "기업_단체명2": "GS E&R", "부서2": "회계팀", "이메일2": "chunil@gsenr.com",
          "칭찬_유형2": "공감 한 스푼", "칭찬_내용2": "책임감 있게 마무리해 줬어요.", "추가_여부2": "네, 한 명 더 남길게요"}]

          칭찬한 사람이 1명이면 1번만, 2명이면 1번과 2번, 3명이면 1번부터 3번까지 필드를 출력합니다. 응답시간은 칭찬받은 사람에게
          온 칭찬 중 가장 이른 응답시간을 기준으로 합니다. 수신이메일이 여러 개인 경우 첫 번째로 등장한 값을 사용합니다.'
