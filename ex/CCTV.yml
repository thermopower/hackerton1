        _inParallelHovering: false
        _isEntering: false
        code: "def main(temperature, pressure, vibration, sensor_id, timestamp):\n\
          \    # 정상 범위 정의\n    NORMAL_RANGES = {\n        'temperature': {'min': 15,\
          \ 'max': 85},\n        'pressure': {'min': 1.0, 'max': 10.0},\n        'vibration':\
          \ {'min': 0, 'max': 4.5}\n    }\n    \n    anomalies = []\n    severity\
          \ = 'normal'\n    \n    # 온도 검사\n    if temperature < NORMAL_RANGES['temperature']['min']:\n\
          \        anomalies.append(f\"온도 과소: {temperature}°C (정상 범위: {NORMAL_RANGES['temperature']['min']}-{NORMAL_RANGES['temperature']['max']}°C)\"\
          )\n        severity = 'warning'\n    elif temperature > NORMAL_RANGES['temperature']['max']:\n\
          \        anomalies.append(f\"온도 과다: {temperature}°C (정상 범위: {NORMAL_RANGES['temperature']['min']}-{NORMAL_RANGES['temperature']['max']}°C)\"\
          )\n        severity = 'critical'\n    \n    # 압력 검사\n    if pressure < NORMAL_RANGES['pressure']['min']:\n\
          \        anomalies.append(f\"압력 과소: {pressure} bar (정상 범위: {NORMAL_RANGES['pressure']['min']}-{NORMAL_RANGES['pressure']['max']}\
          \ bar)\")\n        severity = 'warning' if severity == 'normal' else severity\n\
          \    elif pressure > NORMAL_RANGES['pressure']['max']:\n        anomalies.append(f\"\
          압력 과다: {pressure} bar (정상 범위: {NORMAL_RANGES['pressure']['min']}-{NORMAL_RANGES['pressure']['max']}\
          \ bar)\")\n        severity = 'critical'\n    \n    # 진동 검사\n    if vibration\
          \ > NORMAL_RANGES['vibration']['max']:\n        anomalies.append(f\"진동 과다:\
          \ {vibration} mm/s (정상 범위: 0-{NORMAL_RANGES['vibration']['max']} mm/s)\"\
          )\n        severity = 'critical'\n    \n    # 이상 징후 여부\n    has_anomaly\
          \ = 'true' if len(anomalies) > 0 else 'false'\n    \n    return {\n    \
          \    'has_anomaly': has_anomaly,\n        'severity': severity,\n      \
          \  'anomaly_details': ', '.join(anomalies) if anomalies else '정상 범위 내',\n\
          \        'analysis_summary': f\"센서 {sensor_id} 분석 완료 ({timestamp}): {len(anomalies)}건의\
          \ 이상 징후 탐지\"\n    }"
        code_language: python3
        desc: 센서 데이터를 정상 범위와 비교하여 이상 징후 탐지
        outputs:
          analysis_summary:
            type: string
          anomaly_details:
            type: string
          has_anomaly:
            type: string
          severity:
            type: string
