app:
  description: 센서 데이터를 실시간으로 수집하여 정상 범위와 비교 분석하고, 이상 징후 발생 시 즉시 웨어러블 기기로 알림을 전송하며,
    설비 상태와 이상 발생 시점을 자동 기록하여 사고 원인 분석을 지원하는 안전 모니터링 시스템
  icon: 🤖
  icon_background: '#7C3AED'
  memory_config: null
  mode: workflow
  name: CCTV
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
